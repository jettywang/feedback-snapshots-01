[tox]
env_list = integration, unit, lint

[testenv]
set_env =
    PROJECT_MODE = {env:PROJECT_MODE:test}
pass_env = PYTEST_*
commands = pytest -q {posargs:tests}

[testenv:integration]
commands = pytest -q -m integration {posargs:tests/integration}

[testenv:unit]
commands = pytest -q {posargs:tests}

[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check .

[pkgenv]
pass_env = PKG_CONFIG_PATH
