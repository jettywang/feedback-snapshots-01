[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "demo-project"
version = "0.1.0"
[tool.tox]
env_list = ["py"]
[tool.tox.env_run_base]
commands = [["pytest", "-q", { replace = "posargs", default = ["tests"], extend = true }]]
set_env = { DEPLOY_TARGET = "staging" }
pass_env = ["DEPLOY_TARGET"]
